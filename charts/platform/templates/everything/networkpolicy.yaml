{{- if and .Values.everything.enabled .Values.everything.networkPolicy.enabled }}
{{- $ctx := dict "ctx" $ "component" "everything" }}
# Only this release's gateway pods (stable, plus the canary while enabled) may open connections to
# server-everything: its tools (e.g. gzip-file-as-resource fetches a URL) must be reached through
# callTool, which audits every call.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform.componentName" $ctx }}
  labels:
    {{- include "platform.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "platform.selectorLabels" $ctx | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Same namespace only (a bare podSelector never matches other namespaces).
        - podSelector:
            {{- include "platform.gatewayPeerSelector" . | nindent 12 }}
      ports:
        - protocol: TCP
          port: 3001
{{- end }}
