{{- if .Values.everything.enabled }}
{{- $ctx := dict "ctx" $ "component" "everything" }}
{{- $v := .Values.everything }}
# MCP reference server "everything" (G6): the second upstream, and the one D7 scales to 0 to show
# a single upstream failing while the others keep working. Holds no credentials.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.componentName" $ctx }}
  labels:
    {{- include "platform.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "platform.labels" $ctx | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      # The image stops on SIGINT (STOPSIGNAL) and exits at once; nothing to drain.
      terminationGracePeriodSeconds: 10
      securityContext:
        # node user of the node:22-alpine image.
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: everything
          image: "{{ $v.image.repository }}:{{ $v.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $v.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: "3001"
          # The server has no health route (every path but /mcp is 404, and /mcp needs a
          # JSON-RPC session), so the probes check that the port accepts connections.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          volumeMounts:
            # The root filesystem is read-only; give Node a writable /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
{{- end }}
