{{- if and .Values.postgres.enabled .Values.postgres.networkPolicy.enabled }}
{{- $ctx := dict "ctx" $ "component" "postgres" }}
# Only this release's gateway pods (stable, plus the canary while enabled) may open connections to
# Postgres (holds users, key hashes, encrypted credentials).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform.componentName" $ctx }}
  labels:
    {{- include "platform.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "platform.selectorLabels" $ctx | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            {{- include "platform.gatewayPeerSelector" . | nindent 12 }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
