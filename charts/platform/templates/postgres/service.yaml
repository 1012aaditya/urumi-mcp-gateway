{{- if .Values.postgres.enabled }}
{{- $ctx := dict "ctx" $ "component" "postgres" }}
# Headless Service: stable pod DNS for the StatefulSet.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform.componentName" $ctx }}-headless
  labels:
    {{- include "platform.labels" $ctx | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "platform.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# ClusterIP Service the gateway connects to. Internal only.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform.componentName" $ctx }}
  labels:
    {{- include "platform.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "platform.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
