{{- if and .Values.networkPolicy.enabled .Values.gateway.enabled }}
# Gateway (stable + canary) egress: its Postgres, the two in-cluster MCP upstreams, and the public
# internet on 80/443 (Anthropic API, GitLab MCP, admin-registered remote MCP servers). Private
# ranges are excluded, so — on top of the SSRF guard — an upstream URL cannot reach MariaDB,
# WordPress or any other in-cluster address.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform.componentName" (dict "ctx" $ "component" "gateway") }}-egress
  labels:
    {{- include "platform.labels" (dict "ctx" $ "component" "gateway") | nindent 4 }}
spec:
  podSelector:
    {{- include "platform.gatewayPeerSelector" . | nindent 4 }}
  policyTypes:
    - Egress
  egress:
    {{- if .Values.postgres.enabled }}
    - to:
        {{- include "platform.np.peer" (dict "ctx" $ "component" "postgres") | nindent 8 }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- if .Values.wooMcp.enabled }}
    - to:
        {{- include "platform.np.peer" (dict "ctx" $ "component" "woo-mcp") | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- if .Values.everything.enabled }}
    - to:
        {{- include "platform.np.peer" (dict "ctx" $ "component" "everything") | nindent 8 }}
      ports:
        - protocol: TCP
          port: 3001
    {{- end }}
    {{- if .Values.hosted.enabled }}
    # Hosted MCP servers (ADR 014): the pods the gateway runs (any port: each server has its own).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "platform.hosted.namespace" . }}
          podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: urumi-gateway
    {{- end }}
    {{- if .Values.multiStore.enabled }}
    # Stores (ADR 015): each store's woo-mcp, nothing else in a store namespace.
    - to:
        - namespaceSelector:
            matchLabels:
              urumi.io/store: "true"
          podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: urumi-gateway
              app.kubernetes.io/component: woo-mcp
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- if include "platform.gatewayKubeAccess" . }}
    # The Kubernetes API that creates them (same rule as the bootstrap Job; narrow kubeApi.cidr).
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.kubeApi.cidr }}
      ports:
        {{- range .Values.networkPolicy.kubeApi.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- include "platform.np.internetEgress" . | nindent 4 }}
{{- end }}
