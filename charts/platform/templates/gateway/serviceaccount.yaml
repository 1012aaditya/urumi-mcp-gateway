{{- if include "platform.gatewayKubeAccess" . }}
# ServiceAccount of the gateway pods, only while hosted MCP servers (ADR 014) or multiple stores
# (ADR 015) are on. No automatic token: the gateway pod template projects one (1 h, rotated by the
# kubelet). Its permissions: the hosted Role (templates/hosted/rbac.yaml) and the store ClusterRoles
# (templates/stores/rbac.yaml). Nothing in the release namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "platform.gatewayServiceAccount" . }}
  labels:
    {{- include "platform.labels" (dict "ctx" $ "component" "gateway") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
