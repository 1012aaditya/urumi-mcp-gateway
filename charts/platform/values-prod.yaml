# VPS / production. Replace the placeholder host before installing.
# The Secret `secretName` must already exist in the namespace (created out-of-band; see values.yaml).
#   helm upgrade --install urumi charts/platform -n urumi -f charts/platform/values-prod.yaml --wait

secretName: urumi-env

ingress:
  className: traefik

store:
  host: store.example.com
  url: ''
  # Enable once a certificate exists for the host (e.g. cert-manager issuing into secretName);
  # store.url then defaults to https://<host>.
  tls:
    enabled: false
    secretName: store-tls

app:
  host: app.example.com
  # Enable once a certificate exists for the host (gateway.publicOrigin is already https).
  tls:
    enabled: false
    secretName: app-tls

dashboard:
  enabled: true
  image:
    # Replace with the project's GitLab container registry path and a released tag.
    repository: registry.gitlab.com/<group>/<project>/dashboard
    tag: ''
    pullPolicy: IfNotPresent

mariadb:
  persistence:
    size: 5Gi
    # Empty = the cluster's default StorageClass.
    storageClass: ''

wordpress:
  runAsNonRoot: true
  persistence:
    size: 5Gi
    storageClass: ''

bootstrap:
  enabled: true
  # Served over HTTPS; see values.yaml for in-cluster HTTP calls (X-Forwarded-Proto).
  environmentType: production
  storeTitle: Urumi Store
  # The Job downloads WooCommerce from wordpress.org: the cluster needs egress to it.

postgres:
  persistence:
    size: 5Gi
    storageClass: ''

wooMcp:
  image:
    # Replace with the project's GitLab container registry path and a released tag.
    repository: registry.gitlab.com/<group>/<project>/woo-mcp
    tag: ''
    pullPolicy: IfNotPresent
  # environmentType is `production`: in-cluster HTTP calls must claim HTTPS.
  forwardedProto: https
  hostHeader: ''

everything:
  enabled: true
  image:
    # Replace with the project's GitLab container registry path and a released tag.
    repository: registry.gitlab.com/<group>/<project>/everything
    tag: ''
    pullPolicy: IfNotPresent

gateway:
  image:
    # Replace with the project's GitLab container registry path and a released tag.
    repository: registry.gitlab.com/<group>/<project>/gateway
    tag: ''
    pullPolicy: IfNotPresent
  # Replace with the dashboard's HTTPS origin.
  publicOrigin: https://app.example.com
  cookieSecure: true
  chatModel: claude-sonnet-5-5
  # Two replicas (ADR 010): a pod restart or node drain never takes /mcp down.
  replicas: 2

# Canary (#23): switched on/off by scripts/canary/run.sh; app.tls also secures its IngressRoute.
gatewayCanary:
  enabled: false

# Default-deny NetworkPolicies + per-flow allows. The defaults match k3s (Traefik and CoreDNS in
# kube-system); change ingressController / dns for another distribution. Set kubeApi.cidr to the
# API server's address (kubectl get endpoints kubernetes) as <ip>/32 to narrow the bootstrap
# Job's API egress.
networkPolicy:
  enabled: true
  kubeApi:
    cidr: 0.0.0.0/0
  wordpressInternetEgress: true

# Hosted MCP servers (ADR 014): on, with digest pinning and only this project's own registry path
# allowed. Replace the prefix with your registry; add e.g. docker.io/mcp/ deliberately.
hosted:
  enabled: true
  requireDigest: true
  allowedImages:
    - registry.gitlab.com/<group>/<project>/

# Multiple stores (ADR 015): off in production unless you opt in. It gives the gateway cluster-wide
# rights on namespaces (confined by the admission policy to store-* namespaces); turn it on
# deliberately, with a wildcard DNS name + TLS for domainSuffix.
multiStore:
  enabled: false
  maxStores: 3
  domainSuffix: store.example.com
  scheme: https
