# Local k3d cluster (scripts/cluster-up.sh).
#   helm upgrade --install urumi charts/platform -n urumi -f charts/platform/values-local.yaml --wait

secretName: urumi-env

ingress:
  className: traefik

store:
  # *.localtest.me resolves to 127.0.0.1; k3d maps host port 80 to Traefik.
  host: store.localtest.me
  url: http://store.localtest.me
  tls:
    enabled: false

app:
  host: app.localtest.me
  tls:
    enabled: false

dashboard:
  enabled: true
  image:
    # Pushed by scripts/build-images.sh to localhost:5005; the k3d nodes pull it by this name.
    repository: k3d-urumi-registry.localhost:5005/urumi-dashboard
    tag: dev
    pullPolicy: Always

mariadb:
  persistence:
    size: 2Gi
    storageClass: local-path

wordpress:
  runAsNonRoot: true
  persistence:
    size: 2Gi
    storageClass: local-path

bootstrap:
  enabled: true
  # Plain HTTP locally: Application Passwords need `local` (or HTTPS).
  environmentType: local
  storeTitle: Urumi Store (local)

postgres:
  persistence:
    size: 1Gi
    storageClass: local-path

wooMcp:
  image:
    # Pushed by scripts/build-images.sh to localhost:5005; the k3d nodes pull it by this name.
    repository: k3d-urumi-registry.localhost:5005/urumi-woo-mcp
    tag: dev
    pullPolicy: Always
  # bootstrap.environmentType is `local`: Application Passwords work over plain HTTP.
  forwardedProto: ''
  hostHeader: ''

everything:
  enabled: true
  image:
    # Pushed by scripts/build-images.sh to localhost:5005; the k3d nodes pull it by this name.
    repository: k3d-urumi-registry.localhost:5005/urumi-everything
    tag: dev
    pullPolicy: Always

gateway:
  image:
    # Pushed by scripts/build-images.sh to localhost:5005; the k3d nodes pull it by this name.
    repository: k3d-urumi-registry.localhost:5005/urumi-gateway
    tag: dev
    # :dev is rebuilt in place; always pull the latest push.
    pullPolicy: Always
  publicOrigin: http://app.localtest.me
  cookieSecure: false
  chatModel: claude-sonnet-5-5
  # Two replicas (ADR 010); tests/e2e D10 proves both serve /mcp and survive a pod kill.
  replicas: 2
  # Smaller pods locally (8 GB laptops): two replicas fit where one did.
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # Generous enough for the e2e load step, low enough that D10's burst of 150 hits the key limit.
  rateLimit:
    perKey:
      perMinute: 600
      burst: 100
    perUser:
      perMinute: 1200
      burst: 400

# Canary (#23): switched on/off per run by scripts/canary/run.sh (helm --reset-then-reuse-values).
gatewayCanary:
  enabled: false

# Default-deny NetworkPolicies + per-flow allows (enforced by k3s's kube-router). Traefik and
# CoreDNS are k3s's, in kube-system (the defaults).
networkPolicy:
  enabled: true
  wordpressInternetEgress: true

# Hosted MCP servers (ADR 014): the local registry (where scripts/build-images.sh pushes, e.g. the
# urumi-everything demo image) and Docker Hub's official mcp/ namespace.
hosted:
  enabled: true
  allowedImages:
    - k3d-urumi-registry.localhost:5005/
    - docker.io/mcp/

# Multiple stores (ADR 015): on locally, at most 3; storefronts at http://<slug>.store.localtest.me
# (*.localtest.me resolves to 127.0.0.1). local-path volumes are deleted with the namespace.
multiStore:
  enabled: true
  maxStores: 3
  domainSuffix: store.localtest.me
  scheme: http
  persistence:
    storageClass: local-path
