# Dashboard static server. Runs as the unprivileged nginx user on :8080 and writes only to /tmp,
# so the container works with a read-only root filesystem plus a writable /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Every response, errors included. Locations below must not use add_header, or these are dropped.
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Clickjacking: the OAuth consent page (/consent) must never be framed. frame-ancestors above
    # covers modern browsers; X-Frame-Options covers old ones.
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Vite's hashed bundles never change under the same name.
    location /assets/ {
      expires 1y;
      try_files $uri =404;
    }

    # SPA: client-side routes (/members, /keys, ...) all get index.html, which is never cached.
    location / {
      expires -1;
      try_files $uri /index.html;
    }
  }
}
