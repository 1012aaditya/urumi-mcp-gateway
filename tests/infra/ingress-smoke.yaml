# Applied by scripts/smoke-ingress.sh into the throwaway namespace `smoke`.
# nginx behind a Service and an Ingress on test.localtest.me, plus a busybox client
# used to prove NetworkPolicy enforcement from inside the namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/instance: smoke
    app.kubernetes.io/component: smoke-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
      app.kubernetes.io/instance: smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
        app.kubernetes.io/instance: smoke
        app.kubernetes.io/component: smoke-server
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # Unprivileged variant listens on 8080 and runs as uid 101.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/instance: smoke
spec:
  selector:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/instance: smoke
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/instance: smoke
spec:
  ingressClassName: traefik
  rules:
    - host: test.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  labels:
    app.kubernetes.io/name: client
    app.kubernetes.io/instance: smoke
    app.kubernetes.io/component: smoke-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: client
      app.kubernetes.io/instance: smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: client
        app.kubernetes.io/instance: smoke
        app.kubernetes.io/component: smoke-client
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: busybox
          image: busybox:1.36
          command: ['sh', '-c', 'while true; do sleep 3600; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          readinessProbe:
            exec:
              command: ['true']
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ['true']
            periodSeconds: 30
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
