# build: app images (MR: build only; protected main/tags: push) + chart package.
# secure: Secret Detection, SAST, IaC, and Container Scanning of the pushed images.
# release: Helm chart push, after the scans. Release jobs: .gitlab/ci/release.gitlab-ci.yml.
# Duo flows are started by assigning their service accounts: .gitlab/ci/duo-dispatch.gitlab-ci.yml.
stages:
  - lint
  - test
  - build
  - secure
  - release
  - deploy

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/SAST-IaC.gitlab-ci.yml
  - local: .gitlab/ci/release.gitlab-ci.yml
  - local: .gitlab/ci/canary.gitlab-ci.yml
  - local: .gitlab/ci/duo-dispatch.gitlab-ci.yml

# Run on merge requests, the default branch, tags, and any branch push. A branch
# push with an open MR is skipped so the MR pipeline is the only one.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

variables:
  SAST_EXCLUDED_PATHS: 'node_modules, dist, coverage, .npm'
  # Let the security template jobs run in MR pipelines, not only branch pipelines.
  AST_ENABLE_MR_PIPELINES: 'true'

default:
  image: node:22-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

lint:
  stage: lint
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run typecheck

test:
  stage: test
  # Gateway integration tests run against a real Postgres (no DB mocks).
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test-only-not-a-secret
    POSTGRES_DB: test
    TEST_DATABASE_URL: postgres://test:test-only-not-a-secret@postgres:5432/test
  script:
    - npm ci --cache .npm --prefer-offline
    - npm test

# Security scanners from the templates default to the `test` stage; run them after it.
secret_detection:
  stage: secure
  cache: []

semgrep-sast:
  stage: secure
  cache: []

kics-iac-sast:
  stage: secure
  cache: []
